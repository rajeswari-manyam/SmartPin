<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/png" href="%PUBLIC_URL%/assets/flexhours-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="FlexHours - Work, Hire, Anywhere" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/assets/flexhours-logo.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>FlexHours</title>

  <!-- 🔴 CRITICAL: Prevent Google Translate zoom / banner -->
  <style>
    /* Hide Google Translate top bar iframe */
    iframe.skiptranslate {
      display: none !important;
      visibility: hidden !important;
    }

    /* Hide banner frame */
    .goog-te-banner-frame {
      display: none !important;
    }

    /* Hide tooltip & icon */
    .goog-te-gadget-icon,
    .goog-tooltip,
    .goog-tooltip:hover {
      display: none !important;
    }

    /* FORCE body back to normal */
    body {
      top: 0 !important;
      position: static !important;
    }

    html {
      scroll-behavior: smooth;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- 🔹 Hidden Google Translate container -->
  <div id="google_translate_element" style="display:none;"></div>

  <!-- 🔹 Google Translate Init -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: "en",
          includedLanguages: "en,hi,ta,te,kn,ml,pa,bn,gu,mr,ur,or,as",
          autoDisplay: false
        },
        "google_translate_element"
      );
    }
  </script>

  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
  </script>
</body>

</html>
